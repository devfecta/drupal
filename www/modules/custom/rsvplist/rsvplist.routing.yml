# https://www.drupal.org/docs/drupal-apis/routing-system/structure-of-routes
rsvplist.formdemo:
  path: '/rsvplistdemo'
  defaults:
    _form: '\Drupal\rsvplist\Form\RSVPForm'
    _title: 'RSVP Form Demo'
  requirements:
    _permission: 'view rsvplist' # Set in the rsvplist.permissions.yml file.

rsvplist.admin_settings:
  path: /admin/config/content/rsvplist
  defaults:
    _form: \Drupal\rsvplist\Form\RSVPSettingsForm
    _title: RSVP List Settings
  requirements:
    _permission: administer rsvplist